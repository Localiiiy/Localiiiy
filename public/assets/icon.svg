<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <radialGradient id="radarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#10B981" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" stroke="#1E293B" stroke-width="8" />
  <circle cx="256" cy="256" r="200" fill="url(#radarGlow)" />

  <!-- Radar concentric rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#10B981" stroke-width="4" stroke-opacity="0.2" />
  <circle cx="256" cy="256" r="125" fill="none" stroke="#10B981" stroke-width="4" stroke-opacity="0.35" stroke-dasharray="12 12" />
  <circle cx="256" cy="256" r="70" fill="none" stroke="#10B981" stroke-width="4" stroke-opacity="0.5" />

  <!-- Crosshairs -->
  <line x1="256" y1="66" x2="256" y2="446" stroke="#10B981" stroke-width="2" stroke-opacity="0.25" />
  <line x1="66" y1="256" x2="446" y2="256" stroke="#10B981" stroke-width="2" stroke-opacity="0.25" />

  <!-- Radar sweep line -->
  <line x1="256" y1="256" x2="390" y2="122" stroke="#34D399" stroke-width="5" stroke-linecap="round" />

  <!-- Center Pin -->
  <circle cx="256" cy="256" r="24" fill="url(#emeraldGrad)" />
  <circle cx="256" cy="256" r="10" fill="#FFFFFF" />

  <!-- Local Blip 1 (Emerald) -->
  <circle cx="170" cy="180" r="14" fill="#10B981" />
  <circle cx="170" cy="180" r="22" fill="none" stroke="#10B981" stroke-width="3" stroke-opacity="0.5" />

  <!-- Market Blip 2 (Amber) -->
  <circle cx="350" cy="330" r="16" fill="#F59E0B" />
  <circle cx="350" cy="330" r="26" fill="none" stroke="#F59E0B" stroke-width="3" stroke-opacity="0.6" />

  <!-- Local Blip 3 (Emerald) -->
  <circle cx="320" cy="160" r="12" fill="#10B981" />
</svg>