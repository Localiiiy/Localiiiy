name: Deploy Web App to Firebase Hosting on Push

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy public/ to localiiiy.web.app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting (localiiiy)
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/fb-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS="/tmp/fb-sa.json"
            firebase deploy --only hosting --project localiiiy
            rm -f /tmp/fb-sa.json
          elif [ -n "$FIREBASE_TOKEN" ]; then
            firebase deploy --only hosting --project localiiiy --token "$FIREBASE_TOKEN"
          else
            echo "⚠️ Neither FIREBASE_TOKEN nor FIREBASE_SERVICE_ACCOUNT is set in GitHub Actions Secrets."
            exit 0
          fi
