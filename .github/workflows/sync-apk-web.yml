name: Continuous APK-to-Web Parity & Mirror Sync

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-sync-apk:
    name: Compile Signed APK & Sync Web Distribution
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 📱 Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 🐘 Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: 🔐 Prepare Environment, Keystore & Firebase Template
        run: |
          if [ ! -f ".env" ]; then
            cp .env.example .env || touch .env
          fi
          if [ ! -f "app/google-services.json" ]; then
            cp app/google-services.example.json app/google-services.json
          fi
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: 🔨 1. Compile Android APK
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: 📦 2. Copy Fresh APK into Web Distribution Paths
        run: |
          mkdir -p public/downloads downloads
          cp app/build/outputs/apk/debug/app-debug.apk public/downloads/Localiiiy.apk
          cp app/build/outputs/apk/debug/app-debug.apk public/Localiiiy.apk
          cp app/build/outputs/apk/debug/app-debug.apk downloads/Localiiiy.apk
          cp app/build/outputs/apk/debug/app-debug.apk Localiiiy.apk

      - name: 🏷️ 3. Update Release Metadata in Web App
        run: |
          APK_SHA=$(sha256sum Localiiiy.apk | awk '{print $1}')
          APK_SIZE=$(du -h Localiiiy.apk | awk '{print $1}')
          VERSION="v2.4.0"
          echo "$APK_SHA  Localiiiy.apk" > public/downloads/checksums.txt
          sed -i "s/SHA-256: [a-f0-9]*/SHA-256: $APK_SHA/g" public/index.html || true
          sed -i "s/SHA-256: [a-f0-9]*/SHA-256: $APK_SHA/g" index.html || true
          echo "Synced metadata: Version $VERSION | Size $APK_SIZE | SHA256 $APK_SHA"

      - name: 🚀 4. Deploy to Firebase Hosting (if FIREBASE_SERVICE_ACCOUNT is configured)
        continue-on-error: true
        env:
          FB_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$FB_SA" ]; then
            echo "$FB_SA" > /tmp/fb-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS="/tmp/fb-sa.json"
            npx --yes firebase-tools deploy --only hosting --project localiiiy
            rm -f /tmp/fb-sa.json
          else
            echo "FIREBASE_SERVICE_ACCOUNT secret not configured yet in this repo; skipping Firebase CLI deploy."
          fi
