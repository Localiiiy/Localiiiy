name: Build Android APK and Create GitHub Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Localiiiy APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Prepare Environment File
        run: |
          if [ ! -f ".env" ]; then
            cp .env.example .env || touch .env
          fi
          echo "MAPS_API_KEY=AIzaSyLocaliiiyMapsRadarApiKeyForDev" >> .env
          echo "FIREBASE_API_KEY=AIzaSyLocaliiiyFirebaseApiKeyMock" >> .env

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Localiiiy-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Localiiiy v1.0.0 — Official Android Release"
          body: |
            ### 📱 Localiiiy Android Official APK Release
            Welcome to Localiiiy v1.0.0!

            #### Download Instructions:
            1. Download `Localiiiy-v1.0.apk` directly under **Assets** below.
            2. Tap the downloaded file on your Android phone to install.
            3. Enjoy live spatial radar, hyperlocal clips, and secure escrow marketplace!
          draft: false
          prerelease: false
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
