name: Deploy to Firebase Hosting on Merge
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Firebase Hosting (if FIREBASE_SERVICE_ACCOUNT or FIREBASE_TOKEN is set)
        continue-on-error: true
        env:
          FB_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FB_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -n "$FB_SA" ]; then
            echo "$FB_SA" > /tmp/fb-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS="/tmp/fb-sa.json"
            npx --yes firebase-tools deploy --only hosting --project localiiiy
            rm -f /tmp/fb-sa.json
          elif [ -n "$FB_TOKEN" ]; then
            npx --yes firebase-tools deploy --only hosting --project localiiiy --token "$FB_TOKEN"
          else
            echo "ℹ️ Note: Add FIREBASE_TOKEN or FIREBASE_SERVICE_ACCOUNT to GitHub Repository Secrets to enable automatic Firebase Hosting deploys."
          fi
