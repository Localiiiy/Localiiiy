name: Automated APK Compilation, Web Sync & Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-compile-deploy:
    name: Sync APK & Deploy Unified Web App
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 📱 Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 🐘 Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: 🔐 Prepare Environment, Keystore & Secrets
        run: |
          if [ ! -f ".env" ]; then
            cp .env.example .env || touch .env
          fi
          if [ ! -f "app/google-services.json" ]; then
            cp app/google-services.example.json app/google-services.json
          fi
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: 🔨 Compile Signed Android APK
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: 📦 Sync Fresh APK into Web Distribution & Update Metadata
        run: |
          mkdir -p downloads public/downloads
          cp app/build/outputs/apk/debug/app-debug.apk Localiiiy.apk
          cp app/build/outputs/apk/debug/app-debug.apk downloads/Localiiiy.apk
          cp app/build/outputs/apk/debug/app-debug.apk public/downloads/Localiiiy.apk
          cp app/build/outputs/apk/debug/app-debug.apk public/Localiiiy.apk
          
          APK_SHA=$(sha256sum Localiiiy.apk | awk '{print $1}')
          APK_SIZE=$(du -h Localiiiy.apk | awk '{print $1}')
          echo "$APK_SHA  Localiiiy.apk" > downloads/checksums.txt
          echo "$APK_SHA  Localiiiy.apk" > public/downloads/checksums.txt
          
          sed -i "s/SHA-256: [a-f0-9]*/SHA-256: $APK_SHA/g" public/index.html || true
          sed -i "s/SHA-256: [a-f0-9]*/SHA-256: $APK_SHA/g" index.html || true

      - name: 🚀 Deploy to Firebase Hosting (if FIREBASE_SERVICE_ACCOUNT is configured)
        continue-on-error: true
        env:
          FB_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$FB_SA" ]; then
            echo "$FB_SA" > /tmp/fb-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS="/tmp/fb-sa.json"
            npx --yes firebase-tools deploy --only hosting --project localiiiy
            rm -f /tmp/fb-sa.json
          else
            echo "FIREBASE_SERVICE_ACCOUNT secret not configured yet in this repo; skipping Firebase CLI deploy."
          fi

      - name: 🏷️ Publish / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.4.0
          name: "Localiiiy v2.4.0 — Official Android Release & 100% Web Parity Sync"
          body: |
            ### 📱 Localiiiy Android Official Release (v2.4.0)
            100% synchronized with live Web app deployment (`https://localiiiy.web.app`).
          draft: false
          prerelease: false
          files: |
            Localiiiy.apk
            downloads/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
